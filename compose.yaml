services:
  google-keep-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-keep-mcp:local
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
